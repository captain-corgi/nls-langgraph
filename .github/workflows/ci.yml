name: CI

on:
  pull_request:
  push:
    branches:
      - DevMaster
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nl_sql_chatbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nl_sql_chatbot/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Ruff
        run: python -m ruff check .
      - name: Pytest
        run: python -m pytest tests/ -v
